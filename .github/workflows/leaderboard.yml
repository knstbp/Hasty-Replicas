name: Sync Online Leaderboard to Repository

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull Live Scores & Merge into data/leaderboard.json
        run: |
          python3 - << 'EOF'
          import json, os, datetime, urllib.request

          path = "data/leaderboard.json"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  db = json.load(f)
          else:
              db = {"updatedAt": "", "entries": []}

          entries = list(db.get("entries", []))

          try:
              url = "https://ntfy.sh/hasty_replicas_lb_knstbp_v1/json?poll=1&since=48h"
              req = urllib.request.Request(url, headers={"User-Agent": "HastyReplicasSync/1.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  lines = r.read().decode("utf-8").strip().splitlines()
              for line in lines:
                  if not line.strip():
                      continue
                  pkt = json.loads(line)
                  if pkt.get("event") == "message" and pkt.get("message"):
                      payload = json.loads(pkt["message"])
                      if isinstance(payload.get("entries"), list):
                          entries.extend(payload["entries"])
                      elif payload.get("player") and payload.get("paintingId"):
                          entries.append(payload)
          except Exception as e:
              print("Relay fetch note:", e)

          by_key = {}
          for item in entries:
              if not isinstance(item, dict) or not item.get("player") or not item.get("paintingId"):
                  continue
              player = str(item["player"]).strip()[:24]
              pid = str(item["paintingId"]).strip()
              key = f"{player.lower()}__{pid}"
              acc = round(float(item.get("accuracy", 0)), 1)
              t_used = max(1, min(180, int(item.get("timeUsed", 180))))
              prev = by_key.get(key)
              if not prev or acc > prev["accuracy"] or (acc == prev["accuracy"] and t_used < prev["timeUsed"]):
                  by_key[key] = {
                      "id": item.get("id") or f"gh-{int(datetime.datetime.utcnow().timestamp()*1000)}",
                      "player": player,
                      "paintingId": pid,
                      "paintingTitle": str(item.get("paintingTitle") or pid),
                      "accuracy": acc,
                      "rank": str(item.get("rank") or "C")[:2],
                      "timeUsed": t_used,
                      "date": str(item.get("date") or datetime.datetime.utcnow().strftime("%Y-%m-%d"))[:10]
                  }

          merged = sorted(by_key.values(), key=lambda x: (-x["accuracy"], x["timeUsed"]))[:200]
          db["entries"] = merged
          db["updatedAt"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          os.makedirs("data", exist_ok=True)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(db, f, ensure_ascii=False, indent=2)
              f.write("\n")
          EOF

      - name: Commit and Push Updated data/leaderboard.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(leaderboard): auto-sync online leaderboard scores"
            git push origin main
            git push origin main:gh-pages --force || true
          fi

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Leaderboard Sync Token (if configured in Actions Secrets)
        env:
          LB_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}
        run: |
          if [ -n "$LB_TOKEN" ]; then
            python3 - << 'EOF'
            import base64, os
            t = os.environ.get("LB_TOKEN", "").strip()
            if t:
                mid = len(t) // 2
                a = base64.b64encode(t[:mid].encode("utf-8")).decode("ascii")
                b = base64.b64encode(t[mid:].encode("utf-8")).decode("ascii")
                prefix = f'window.__GH_LB_A = "{a}"; window.__GH_LB_B = "{b}";\n'
                with open("js/leaderboard.js", "r", encoding="utf-8") as f:
                    code = f.read()
                with open("js/leaderboard.js", "w", encoding="utf-8") as f:
                    f.write(prefix + code)
            EOF
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
